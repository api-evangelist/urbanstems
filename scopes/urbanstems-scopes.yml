scopes:
- name: openid
  standard: OpenID Connect Core
  description: Request an ID token identifying the signed-in customer.
- name: email
  standard: OpenID Connect Core
  description: Release the email and email_verified claims for the signed-in customer.
- name: customer-account-api:full
  standard: Shopify Customer Account API
  description: >-
    Full access to the customer account surface on behalf of the signed-in customer — orders,
    addresses, profile and subscription state for this shop.
- name: customer-account-mcp-api:full
  standard: Shopify Customer Account MCP API
  description: >-
    Full access to the customer-account MCP surface on behalf of the signed-in customer. This is the
    authenticated companion to the anonymous commerce MCP endpoint; it is the scope an agent would
    hold to act on a specific buyer's account rather than on the public catalog.

not_scoped:
  surface: UrbanStems Commerce MCP API (https://274513-24.myshopify.com/api/ucp/mcp)
  note: >-
    The UCP commerce endpoint is anonymous — it accepts no bearer token and therefore has no scope
    model. Buyer authority is carried per-call by the payment instrument, not by an OAuth grant.
