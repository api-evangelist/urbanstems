name: UrbanStems authentication profile
slug: urbanstems

summary: >-
  UrbanStems publishes no API keys and runs no developer key-issuance program. Its agent-facing
  commerce API is anonymous: tools/list, catalog search, product lookup, cart and checkout creation
  all succeed with no credential. Authorization moves to the payment step instead of the transport
  step — completing a checkout requires a buyer-approved payment instrument and an idempotency key.
  A separate OAuth 2.0 / OpenID Connect authorization server exists for customer accounts.

schemes:
- id: none
  surface: UrbanStems Commerce MCP API
  endpoint: https://274513-24.myshopify.com/api/ucp/mcp
  type: none
  verified: probed
  evidence:
    request: 'POST tools/list with no Authorization header'
    http_status: 200
    result: 13 tools returned with full inputSchemas
  note: >-
    No API key, bearer token or client credential is required or accepted for tool discovery or for
    catalog, cart and checkout operations.

- id: ucp-agent-profile
  surface: UrbanStems Commerce MCP API
  type: agent-identity
  required: true
  location: request body — meta.ucp-agent.profile
  format: URI
  verified: probed
  note: >-
    Not authentication in the credential sense, but it is a required identity input on all 13 tools:
    every inputSchema lists meta as required, and meta requires ucp-agent, which requires profile —
    "Agent profile URI for UCP discovery." The server identifies the calling agent, not the user.

- id: payment-instrument
  surface: UrbanStems Commerce MCP API — complete_checkout
  type: buyer-authorization
  required: true
  location: request body — checkout.payment.instruments[]
  verified: probed
  handlers:
