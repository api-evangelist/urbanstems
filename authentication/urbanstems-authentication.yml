    handler: com.google.pay
    version: '2026-01-11'
    merchant_id: '16708973830884969730'
    merchant_origin: urbanstems.com
    gateway: shopify
    card_networks: [VISA, MASTERCARD, AMEX, DISCOVER]
    auth_methods: [PAN_ONLY, CRYPTOGRAM_3DS]
    billing_address_required: true
  - id: shopify.card
    handler: dev.shopify.card
    version: '2026-01-15'
    card_brands: [visa, master, american_express, discover, diners_club]
  - id: shop_pay
    handler: dev.shopify.shop_pay
    version: '2026-04-08'
    shop_id: '69340168440'
  note: >-
    complete_checkout requires checkout.payment. Apple Pay instruments are additionally constrained
    by the schema to type "card" with an apple_pay_token credential and a billing_address. The
    provider's own agent instructions state: "Checkout requires human approval. Agents must not
    complete payment without explicit buyer consent."

