gaps:
- No security.txt and no published vulnerability-disclosure contact on any UrbanStems host.
- No developer portal, no API key issuance, no documented client registration for the OAuth server.
- >-
  The MCP endpoint UrbanStems documents in /llms.txt and /agents.md
  (https://urbanstems.com/api/ucp/mcp) returns 404; the working endpoint is only discoverable via
  /.well-known/ucp.
