name: UrbanStems standards conformance
slug: urbanstems

conformance:
- id: mcp
  name: Model Context Protocol
  version: '2025-06-18'
  conforms: true
  evidence:
    probe: 'POST initialize -> {"protocolVersion":"2025-06-18","serverInfo":{"name":"universal-commerce","version":"0.1.0"}}'
    url: https://274513-24.myshopify.com/api/ucp/mcp
    http_status: 200
    capabilities: tools.listChanged, prompts.listChanged, resources.listChanged, logging

- id: jsonrpc2
  name: JSON-RPC 2.0
  conforms: true
  evidence:
    probe: 'tools/list response carries {"jsonrpc":"2.0","id":1,"result":{...}}'
    url: https://274513-24.myshopify.com/api/ucp/mcp
    http_status: 200

- id: json-schema-2020-12
  name: JSON Schema Draft 2020-12
  conforms: true
  evidence:
    probe: >-
      Every one of the 13 tool inputSchemas declares
      "$schema":"https://json-schema.org/draft/2020-12/schema", and several use conditional
      applicators (allOf/if/then/else) for the Apple Pay instrument shape.
    file: mcp/urbanstems-ucp-mcp-tools.json

- id: oauth2
  name: OAuth 2.0
  conforms: true
  evidence:
    url: https://urbanstems.com/.well-known/oauth-authorization-server
    http_status: 200
    detail: >-
      RFC 8414 authorization server metadata; authorization_code + refresh_token +
      urn:ietf:params:oauth:grant-type:jwt-bearer grants, S256 PKCE.

- id: oidc
  name: OpenID Connect Discovery 1.0
  conforms: true
  evidence:
    url: https://urbanstems.com/.well-known/openid-configuration
    http_status: 200
    detail: >-
      issuer, token/authorization/end_session endpoints, jwks_uri, RS256 id_token signing, public
      subject types, standard claims.

- id: rfc9728
  name: 'RFC 9728 — OAuth 2.0 Protected Resource Metadata'
  conforms: true
  evidence:
    url: https://urbanstems.com/.well-known/oauth-protected-resource
    http_status: 200
    detail: 'resource, authorization_servers[], bearer_methods_supported: ["header"]'

- id: llmstxt
  name: llms.txt
  conforms: true
  evidence:
    url: https://urbanstems.com/llms.txt
    http_status: 200
    content_type: text/markdown
    detail: >-
      Served as real markdown, referenced from robots.txt ("# llms.txt: /llms.txt"), and mirrored at
      /agents.md which is the single entry in a dedicated /sitemap_agentic_discovery.xml.

- id: idempotency
  name: Idempotent write semantics
  conforms: partial
  evidence:
    detail: >-
      complete_checkout requires meta.idempotency-key. No other write tool (create_cart,
      create_checkout, update_cart, update_checkout) declares or accepts one.
    file: mcp/urbanstems-ucp-mcp-tools.json

- id: pagination
  name: Cursor pagination
  conforms: true
  evidence:
    detail: >-
      search_catalog accepts catalog.pagination.cursor and .limit (default 10, minimum 1) and returns
      pagination.cursor for the next page.
    file: mcp/urbanstems-ucp-mcp-tools.json

- id: rfc9457
  name: 'RFC 9457 — Problem Details for HTTP APIs'
  conforms: false
  evidence:
    detail: >-
      No application/problem+json anywhere. Storefront errors use
      {"error":{"statusCode":..,"message":..}}; MCP errors use the JSON-RPC error object.

