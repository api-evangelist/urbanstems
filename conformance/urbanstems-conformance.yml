- id: openapi
  name: OpenAPI
  conforms: false
  evidence:
    detail: >-
      No OpenAPI is published. Probed /openapi.json (404), /openapi.yaml, /swagger.json, /api-docs,
      /docs and /redoc on urbanstems.com; none returns a spec. The machine-readable contract this
      merchant publishes is the MCP tool schema set, not an OpenAPI.

domain_standards:
- id: ucp
  name: Universal Commerce Protocol
  market: agentic commerce / retail checkout
  declared_version: '2026-08-25'
  conforms: true
  graded: declared-in-contract
  evidence:
    url: https://urbanstems.com/.well-known/ucp
    http_status: 200
    location: 'ucp.services["dev.ucp.shopping"][0] and ucp.capabilities[*]'
    detail: >-
      The merchant profile is the UCP discovery document itself, not a prose claim. It declares the
      dev.ucp.shopping service over MCP transport at a named endpoint plus seven namespaced
      capabilities.
  capabilities_declared:
  - dev.ucp.shopping.cart
  - dev.ucp.shopping.checkout
  - dev.ucp.shopping.fulfillment
  - dev.ucp.shopping.discount
  - dev.ucp.shopping.order
  - dev.ucp.shopping.catalog.search
  - dev.ucp.shopping.catalog.lookup
  - dev.shopify.catalog
  fulfillment_config:
    multi_destination: []
    method_combinations: [[shipping]]
  spec: https://ucp.dev/2026-08-25/specification/overview/
  schema: https://ucp.dev/2026-08-25/services/shopping/mcp.openrpc.json
  schema_ownership_note: >-
    The OpenRPC schema and JSON Schemas referenced by the profile are published by ucp.dev and
    shopify.dev — the standards body and the platform, not UrbanStems. They are cited as the
    standard UrbanStems declares conformance to, and are deliberately NOT saved into this repo as
    UrbanStems' own contract.
  agent_confirmation: >-
    Tool names returned by the live server (search_catalog, lookup_catalog, get_product, create_cart,
    update_cart, cancel_cart, get_cart, create_checkout, update_checkout, complete_checkout,
    cancel_checkout, get_checkout, get_order) match the declared capability set one-for-one, and
    search_catalog's description states "Response conforms to the UCP catalog search capability
    (dev.ucp.shopping.catalog.search)."

- id: payment-handler-profiles
  name: UCP payment handler profiles
  conforms: true
  evidence:
    url: https://urbanstems.com/.well-known/ucp
    http_status: 200
    handlers:
    - com.google.pay 2026-01-11 (Google Pay API v2, PAN_ONLY + CRYPTOGRAM_3DS, gateway shopify)
    - dev.shopify.card 2026-01-15
    - dev.shopify.shop_pay 2026-04-08

- id: iso4217
  name: 'ISO 4217 currency codes'
  conforms: true
  evidence:
    detail: All prices are integer minor units paired with an ISO 4217 code, stated in every tool description.
- id: iso3166-1
  name: 'ISO 3166-1 alpha-2 country codes'
  conforms: true
  evidence:
    detail: context.address_country and billing_address.address_country are documented as alpha-2.
- id: bcp47
  name: 'IETF BCP 47 language tags'
  conforms: true
  evidence:
    detail: context.language documented as "Language tag in IETF BCP 47 format".

compliance_certifications:
  published: false
  note: >-
    UrbanStems publishes no trust center and names no certification (SOC 2, ISO 27001, PCI DSS,
    HIPAA, FedRAMP) on any page probed. Card data never touches an UrbanStems system in the agent
    flow — it is tokenized by Google Pay, Shop Pay or Shopify's card handler — but no PCI attestation
    is published by UrbanStems itself. No Compliance pointer is claimed.
