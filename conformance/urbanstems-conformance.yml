generated: '2026-09-02'
method: probed
source: >-
  https://urbanstems.com/.well-known/ucp (200), /.well-known/openid-configuration (200),
  /.well-known/oauth-protected-resource (200), /llms.txt (200), /agents.md (200),
  /sitemap_agentic_discovery.xml (200), live MCP initialize + tools/list against
