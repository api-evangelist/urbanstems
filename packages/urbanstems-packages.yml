finding: >-
  UrbanStems publishes no client library in any registry. There is no npm package, no PyPI
  distribution, no gem, and no CDN-distributed browser build. This is not an oversight to be filed as
  a gap in the usual way: the company's programmable surface is a remote MCP endpoint that an agent
  POSTs JSON-RPC to, and an MCP endpoint is consumed by an MCP client, not by a vendor SDK. There is
  nothing here for an SDK to wrap. No SDKs pointer is claimed.

