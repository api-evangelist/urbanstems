note: >-
  UrbanStems sells flowers, not API access. There is no API pricing page, no developer plan, no
  metered tier and no paid access model of any kind — the commerce MCP endpoint is free and
  anonymous, and the money changes hands as a retail purchase inside the checkout it exposes. The
  only commercial program adjacent to an integration is Corporate Gifting, and its terms are not
  published: the page advertises "tiered discounts, flat-rate shipping, and a dedicated care
  specialist" and then routes to a "Get in Touch" inquiry form with no percentages, minimums or
  rates stated.

