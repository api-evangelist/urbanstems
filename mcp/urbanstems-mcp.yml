deployment:
  mode: remote
  endpoint: https://274513-24.myshopify.com/api/ucp/mcp
  install: null
  package: null
  auth: none
  verified: probed
  note: >-
    Remote only. There is no first-party stdio package — nothing to npx or pip install. The endpoint
    answers an unauthenticated JSON-RPC tools/list and initialize. Buyer payment credentials are
    supplied per-call through the checkout payment instrument, not through a server credential.

