servers:
- name: UrbanStems UCP Commerce MCP
  endpoint: https://274513-24.myshopify.com/api/ucp/mcp
  transport: streamable-http
  protocol_version: '2025-06-18'
  server_info:
    name: universal-commerce
    version: 0.1.0
  capabilities:
    tools:
      listChanged: true
    prompts:
      listChanged: true
    resources:
      listChanged: true
    logging: {}
  auth: none
  status: live
  tools_file: mcp/urbanstems-ucp-mcp-tools.json
  tool_count: 13
  tools:
  - name: search_catalog
    category: catalog
    write: false
    summary: >-
      Search store products by natural-language query and/or filters (categories, price min/max in
      minor units, available). Cursor-paginated, default limit 10.
  - name: lookup_catalog
    category: catalog
    write: false
    summary: >-
      Resolve up to 10 product or variant GIDs in one request; results grouped by product with
      exact/featured match markers.
  - name: get_product
    category: catalog
    write: false
    summary: >-
      Full product detail for one product ID, with variants, exact pricing and real-time
      availability; supports option selection and buyer preferences.
  - name: get_cart
    category: cart
    write: false
    summary: Return cart contents for a gid://shopify/Cart/... identifier.
  - name: create_cart
    category: cart
    write: true
    summary: Create a cart from line items, with optional buyer, context, attribution, fulfillment and discount codes.
  - name: update_cart
    category: cart
    write: true
    summary: Update line items, buyer, context, fulfillment methods/destinations or discount codes on an existing cart.
  - name: cancel_cart
    category: cart
    write: true
    reverses: create_cart
    summary: Cancel a cart.
  - name: get_checkout
    category: checkout
    write: false
    summary: Return checkout detail including line items, totals, discounts and taxes.
  - name: create_checkout
    category: checkout
    write: true
    summary: >-
      Create a checkout from line items or from an existing cart_id, carrying buyer, fulfillment
      methods and destinations, discount codes and payment instruments.
  - name: update_checkout
    category: checkout
    write: true
    summary: Update an existing checkout — line items, buyer, fulfillment selection, discounts, payment instruments.
  - name: complete_checkout
    category: checkout
    write: true
    summary: >-
      Finalize the purchase and return the order ID and Thank You Page URL. REQUIRES
      meta.idempotency-key, and the provider's own agent instructions require contemporaneous buyer
      approval of payment.
  - name: cancel_checkout
    category: checkout
    write: true
    reverses: create_checkout
    summary: Cancel a checkout that has not been completed.
  - name: get_order
    category: order
    write: false
    summary: Return order detail for a gid://shopify/Order/... identifier.

- name: UrbanStems Storefront MCP
  endpoint: https://274513-24.myshopify.com/api/mcp
  transport: streamable-http
  auth: none
  status: live
  tools_file: mcp/urbanstems-storefront-mcp-tools.json
  tool_count: 1
  tools:
  - name: search_shop_policies_and_faqs
    category: support
    write: false
    summary: >-
      Natural-language question answering over the store's policies, products and services (return
      policy, shipping policy, phone number, hours).

protocols:
- name: Universal Commerce Protocol
  id: dev.ucp.shopping
  version: '2026-08-25'
  supported_versions:
  - '2026-08-25'
  - '2026-04-08'
  - '2026-01-23'
  discovery: https://urbanstems.com/.well-known/ucp
  spec: https://ucp.dev/2026-08-25/specification/overview/
  schema: https://ucp.dev/2026-08-25/services/shopping/mcp.openrpc.json
- name: Model Context Protocol
  version: '2025-06-18'
  transport: streamable-http (JSON-RPC 2.0 over HTTP POST)

notes:
- >-
  meta.ucp-agent.profile (a URI identifying the calling agent's UCP profile) is a REQUIRED input on
  every one of the 13 UCP tools. An agent that omits it is not conformant with this server's schema.
- >-
  All monetary values in requests and responses are integers in ISO 4217 minor units paired with a
  currency code — {"amount": 2500, "currency": "USD"} is $25.00.
- >-
  There is no first-party UrbanStems SDK, CLI or stdio MCP package. The remote endpoint is the
  entire programmable surface.
