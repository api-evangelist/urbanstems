crosswalk:
- tool: search_catalog
  category: catalog
  rest: ['GET /search?q={query}&type=product', 'GET /collections/{handle}/products.json']
  binding: semantic
  confidence: medium
  note: >-
    Both surface product search over the same catalog, but they are not the same operation: the tool
    adds category/price/availability filters, buyer context, cursor pagination and UCP-shaped
    responses, while /search is the storefront's own HTML/JSON search and is Disallowed for crawlers
    in robots.txt.
- tool: get_product
  category: catalog
  rest: ['GET /products/{handle}.json']
  binding: semantic
  confidence: medium
  note: >-
    Different key spaces — the tool takes a gid://shopify/Product/{id}, the route takes a URL handle.
    A client cannot translate between them from published data alone.
- tool: lookup_catalog
  category: catalog
  rest: []
  binding: none
  confidence: high
  note: >-
    Batch resolution of up to 10 product/variant GIDs with exact-vs-featured match markers has no
    documented HTTP equivalent.

mcp_only:
- tool: create_cart
  reason: No public storefront route creates a cart as a JSON resource; /cart is Disallowed in robots.txt.
- tool: get_cart
  reason: Cart state is only readable through the tool; /cart and /carts are Disallowed in robots.txt.
- tool: update_cart
  reason: No documented public HTTP write route.
- tool: cancel_cart
  reason: No documented public HTTP write route.
- tool: create_checkout
  reason: /checkout and /checkouts/ are Disallowed in robots.txt and are browser flows, not an API.
- tool: get_checkout
  reason: No documented public HTTP read route for checkout state.
- tool: update_checkout
  reason: No documented public HTTP write route.
- tool: complete_checkout
  reason: >-
    Payment authorization has no HTTP counterpart on the storefront. This is the only operation
    requiring meta.idempotency-key, and the provider requires contemporaneous buyer approval.
- tool: cancel_checkout
  reason: No documented public HTTP write route.
- tool: get_order
  reason: /orders is Disallowed in robots.txt; order retrieval is tool-only.
- tool: search_shop_policies_and_faqs
  reason: >-
    Retrieval-augmented answering over policy text. The underlying policy pages exist as HTML
    (/policies/privacy-policy, /policies/terms-of-service, /policies/refund-policy,
    /policies/shipping-policy) but there is no query API over them.

rest_only:
- route: GET /collections/all
  reason: A browsable full-catalog listing. The tool surface requires a query or filters — search_catalog has no "return everything" mode.
- route: GET /sitemap.xml
  reason: >-
    Crawl-time discovery, including /sitemap_agentic_discovery.xml, /sitemap_products_1.xml and
    /sitemap_collections_1.xml. No tool exposes the sitemap.
- route: GET /agents.md
  reason: The agent instruction document itself. No tool serves it.
- route: GET /products/{handle}
  reason: Human-facing product page (HTML), with no tool counterpart.
- route: GET /collections/{handle}
  reason: Human-facing collection page (HTML), with no tool counterpart.

