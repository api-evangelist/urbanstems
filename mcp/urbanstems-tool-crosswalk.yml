caveat: >-
  UrbanStems publishes no OpenAPI, so the REST side of this crosswalk has no operationIds. Each row
  binds a tool to the documented HTTP route the provider itself names in /llms.txt, written as
  METHOD path. Confidence is graded accordingly and no row is asserted beyond what the two documents
  state.

