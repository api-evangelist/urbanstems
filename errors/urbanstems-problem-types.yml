problem_types:
- id: resource-not-found
  status: 404
  title: Resource not found
  envelope: Storefront HTTP error
  observed: true
  evidence:
    url: https://urbanstems.com/api/ucp/mcp
    method: POST
    body: '{"error":{"statusCode":404,"message":"Resource not found."}}'
  remediation: >-
    Do not use the /api/ucp/mcp path on the urbanstems.com host — it is the endpoint the provider's
