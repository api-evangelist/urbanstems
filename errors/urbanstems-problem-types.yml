    body_starts_with: '<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>404 Not Found</title>'
  remediation: >-
    Unmatched /.well-known/* paths return an HTML 404 page, not JSON. A client that only checks the
    status code is fine; one that parses the body must not assume JSON.

- id: rate-limited
  status: 429
