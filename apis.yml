- aid: urbanstems:urbanstems-storefront-json-api
  name: UrbanStems Storefront JSON API
  description: >-
    The read-only storefront JSON endpoints UrbanStems documents for agents in its own /llms.txt and
    /agents.md — product JSON at /products/{handle}.json, collection product listings at
    /collections/{handle}/products.json, and the sitemap set including a dedicated agentic-discovery
    sitemap. No authentication is required. These are Shopify Online Store routes served on the
    UrbanStems domain and named by UrbanStems in its own agent instructions.
  humanURL: https://urbanstems.com/llms.txt
  baseURL: https://urbanstems.com
  x-base-note: >-
    The site root IS the API base for this entry, not a marketing URL standing in for one. Shopify
    Online Store JSON routes are served off the storefront origin — https://urbanstems.com/products/{handle}.json
    returned HTTP 200 application/json on 2026-09-02 — and UrbanStems names exactly these paths in its
    own /llms.txt. The other api entry deliberately carries a different host
    (274513-24.myshopify.com), which is where the MCP endpoint actually answers; the two bases
    disagree because the two surfaces genuinely live on different hosts.
  tags:
  - Product
  - Collection
  - Catalog
  - Sitemap
  tags_raw:
  - Products
  - Collections
  - Catalog
  - Sitemap
  properties:
  - type: Documentation
    url: https://urbanstems.com/llms.txt
  - type: LLMsTxt
    url: llms/urbanstems-llms.txt
