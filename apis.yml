aid: urbanstems
name: UrbanStems
description: >-
  UrbanStems is a direct-to-consumer flower and gifting company founded on Valentine's Day 2014 in
  Washington, DC, selling modern bouquets, plants, gifts and centerpieces with same-day delivery in
  major US cities and next-day delivery nationwide, sourced through a vertically integrated supply
  chain that buys direct from Rainforest Alliance Certified farms. Its storefront runs on Shopify at
  urbanstems.com, and the company exposes a genuine agent-facing commerce surface rather than a
  developer API program: a published /llms.txt and /agents.md, a /.well-known/ucp merchant profile
  implementing the Universal Commerce Protocol (UCP 2026-08-25), and a live unauthenticated
  Model Context Protocol endpoint offering thirteen catalog, cart, checkout and order tools that lets
  an agent search the catalog and drive a buyer-approved purchase end to end.
