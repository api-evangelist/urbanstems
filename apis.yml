apis:
- aid: urbanstems:urbanstems-commerce-mcp-api
  name: UrbanStems Commerce MCP API
  description: >-
    The agent-facing commerce surface for the UrbanStems store, implementing the Universal Commerce
    Protocol (dev.ucp.shopping) over MCP. Thirteen tools cover catalog search and lookup, product
    detail, cart create/update/cancel, checkout create/update/complete/cancel, and order retrieval.
    Anonymous — no API key or OAuth token is required to list tools or search the catalog — but
    completing a checkout requires an idempotency key and contemporaneous buyer approval of payment.
  humanURL: https://urbanstems.com/agents.md
  baseURL: https://274513-24.myshopify.com/api/ucp/mcp
  tags:
  - Commerce
  - Catalog
  - Cart
  - Checkout
  - Order
  - Agentic Commerce
  tags_raw:
